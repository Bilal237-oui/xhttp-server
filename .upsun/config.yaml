applications:
    app:
        type: nodejs:20
        web:
            commands:
                start: node server.js
            locations:
                /:
                    allow: true
                    passthru: true
        size:
            cpu: 0.25
            memory: 512

routes:
    "https://{default}/":
        type: upstream
        upstream: "app:http"
        cache:
            enabled: false
    "http://{default}/":
        type: redirect
        to: "https://{default}/"

resources:
    router:
        cpu: 0.1
        memory: 256
