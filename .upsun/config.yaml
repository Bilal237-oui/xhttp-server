applications:
    app:
        type: nodejs:20
        web:
            commands:
                start: node server.js
            locations:
                /:
                    allow: true
                    passthru: true
        size:
            cpu: 1
            memory: 2048

routes:
    "https://{default}/":
        type: upstream
        upstream: "app:http"
        cache:
            enabled: false
    "http://{default}/":
        type: redirect
        to: "https://{default}/"
